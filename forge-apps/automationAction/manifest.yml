modules:
  automation:actionProvider:
    - key: automationaction-automation-action-provider-custom-ui
      actions:
        - automation-action-custom-ui
  action:
    - key: automation-action-custom-ui
      name: Automation action
      function: add-comment-to-issue
      description: adds comment on an issue.
      config:
        resource: main-resource
      inputs:
        issueKey:
          title: Issue Id
          type: string
          description: The issue id for the Jira issue id where a comments needs to be added
          required: true
        comment:
          title: Comment
          type: string
          description: The comment that needs to be added to the issue
          required: true
      actionVerb: CREATE
      resolver:
        function: automation-resolver
  function:
    - key: add-comment-to-issue
      handler: index.addComment
    - key: automation-resolver
      handler: index.handler
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/57d1c46e-2cc1-464a-b046-9a4136ee2ef8
resources:
  - key: main-resource
    path: static/hello-world/build
permissions:
  scopes:
    - write:jira-work
    - read:jira-work
  content:
    styles:
      - unsafe-inline
