modules:
  jira:issueAction:
    - key: modal-replicate-problem-hello-world-issue-action
      resource: main
      resolver:
        function: resolver
      viewportSize: medium
      title: modal-replicate-problem
  function:
    - key: resolver
      handler: index.handler
resources:
  # Main resource for the issue action
  - key: main
    path: static/hello-world/build
  # Resource for the modal (same build, but different resource key for Modal.open())
  - key: my-modal-resource
    path: static/hello-world/build
app:
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/07923b6e-e9b5-4fc4-9efc-7767d51920a2
