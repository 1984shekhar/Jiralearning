modules:
  jira:customField:
    - key: forgecfapp-custom-field-ui-kit-2-hello-world
      name: forgeCFapp
      description: A hello world custom field.
      type: string
      view:
        render: native
        resource: main
        experience:
          - issue-view
          - portal-view
      edit:
        resource: edit
        render: native
        isInline: true
        experience:
          - issue-create
          - issue-transition
          - issue-view
          - portal-request
  jira:issuePanel:
    - key: permission-check-hello-world-issue-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: permission-check
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: src/frontend/index.jsx
  - key: edit
    path: src/frontend/edit.jsx
permissions:
  scopes:
    - read:jira-user
    - read:jira-work
    - write:jira-work
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/f4c6e375-ee48-45ed-8b81-44d56b4c5f7e
