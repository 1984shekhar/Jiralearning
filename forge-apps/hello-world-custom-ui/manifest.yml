modules:
  jira:issuePanel:
    - key: hello-world-custom-ui-hello-world-panel
      resource: main
      resolver:
        function: resolver
      viewportSize: medium
      title: hello-world-custom-ui
      icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static/hello-world/build
permissions:
  scopes:
    - read:jira-work
app:
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/3f9b5976-4120-465a-a4e2-de721e6fd654
