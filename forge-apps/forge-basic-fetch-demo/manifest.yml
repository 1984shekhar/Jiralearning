modules:
  jira:issuePanel:
    - key: forge-basic-fetch-demo-hello-world-panel
      resource: main
      resolver:
        function: resolver
      viewportSize: medium
      title: forge-basic-fetch-demo
      icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static/hello-world/build
permissions:
  scopes:
    - read:jira-work
  external:
    fetch:
      backend:
        - address: jsonplaceholder.typicode.com
app:
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/0d560072-24eb-48e4-bff0-e8ff8a8c1ba7
