modules:
  jira:issuePanel:
    - key: worklog-approvals-issue-panel
      resource: main-ui
      resolver:
        function: resolver
      title: Approval Use Case 1
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg

  function:
    - key: resolver
      handler: index.handler

resources:
  - key: main-ui
    path: src/frontend

permissions:
  scopes:
    - storage:app
    - read:jira-work
    - write:jira-work

app:
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/f5c25e7e-6dce-4274-b1f5-add7cbe94295

