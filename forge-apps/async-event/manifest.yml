modules:
  jira:globalPage:
    - key: async-event-hello-world-global-page
      resource: main
      resolver:
        function: main-handler
      render: native
      title: Async Event App
  consumer:
    - key: my-app-consumer
      queue: my-app-queue
      resolver:
        function: main-handler
        method: event-listener
  function:
    - key: main-handler
      handler: index.handler
resources:
  - key: main
    path: src/frontend/index.jsx
permissions:
  scopes:
    - storage:app
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/72ef913c-6043-463d-b188-4d1a3dcfb905
