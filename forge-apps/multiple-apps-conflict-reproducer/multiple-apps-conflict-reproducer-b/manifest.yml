modules:
  jira:uiModifications:
    - key: multiple-apps-conflict-ui-modifications-b
      title: Multiple Apps Conflict Reproducer B
      resource: uiModificationsMain
  trigger:
    - key: multiple-apps-conflict-install-trigger-b
      function: main
      events:
        - avi:forge:installed:app
        - avi:forge:updated:app
  function:
    - key: main
      handler: index.run
resources:
  - key: uiModificationsMain
    path: static/hello-world/build
permissions:
  scopes:
    - read:jira-user
    - read:jira-work
    - manage:jira-configuration
    - write:jira-work
    - manage:jira-project

app:
  runtime:
    name: nodejs24.x
  id: ari:cloud:ecosystem::app/0c448650-3130-476f-8c38-77244d22cd44
