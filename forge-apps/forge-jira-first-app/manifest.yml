modules:
  jira:issuePanel:
    - key: forge-jira-first-app-hello-world-issue-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: forge-jira-first-app
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: src/frontend/index.jsx
permissions:
  scopes:
    - manage:jira-configuration
    - read:jira-work
    - write:jira-work
    - storage:app  # Add this line to enable storage capabilities
app:
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/4fe0412e-3588-4064-b8c8-6949b52dc022